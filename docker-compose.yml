version: "3.8"

services:

  postgres:
    image: postgres:17
    container_name: employee-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - employee-network


  employee-api:
    image: employee-api
    container_name: employee-api-container
    restart: always
    depends_on:
      - postgres
    ports:
      - "8082:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - employee-network


networks:
  employee-network:
    driver: bridge


volumes:
  postgres-data: